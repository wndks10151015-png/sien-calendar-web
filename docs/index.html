<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191a1c">
  <meta name="description" content="내 일정과 프로젝트를 위한 독립형 캘린더">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https:; img-src 'self' data: blob: https:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'">
  <title>Sien Calendar</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./calendar.css">
  <link rel="stylesheet" href="./web.css">
  <script src="./assets/lucide.js" defer></script>
  <script type="module" src="./app.js"></script>
</head>
<body class="theme-dark">
  <div class="web-app-bar">
    <span class="web-app-name">Sien Calendar</span>
    <div class="web-app-actions">
      <button id="web-theme" type="button" aria-label="밝은 테마로 변경"></button>
      <button id="web-files" type="button" aria-label="파일 보관함"></button>
      <button id="web-settings" type="button" aria-label="캘린더 설정"></button>
      <button id="web-sync" type="button" aria-label="기기 동기화"><span class="web-sync-dot"></span><span id="web-sync-label">GitHub 연결</span></button>
    </div>
  </div>
  <main id="calendar" class="workspace-leaf-content" aria-label="Sien Calendar">
    <p class="web-loading" role="status">캘린더를 불러오는 중…</p>
  </main>
  <div id="notices" class="notice-container" aria-live="polite"></div>
</body>
</html>
